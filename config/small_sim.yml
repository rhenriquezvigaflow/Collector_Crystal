lagoon_id: "small_sim"
product_type: "small"
source: rockwell
poll_seconds: 1
timezone: "America/Santiago"

backend:
  url: "http://127.0.0.1:8090/ingest/scada"

rockwell:
  ip: "192.168.100.11"
  slot: 0
  timeout_sec: 5

# El collector lee estas mismas claves lógicas. Los controles sólo las
# referencian; ninguna dirección Rockwell queda definida en el backend.
tags:
  SEL_MAN_P300: "SEL_MAN_P300"
  SEL_MAN_P410: "SEL_MAN_P410"
  SEL_MAN_P420: "SEL_MAN_P420"
  SEL_MAN_P430: "SEL_MAN_P430"
  EN_MANUAL_P300: "EN_MANUAL_P300"
  EN_AUTO_P300: "EN_AUTO_P300"
  EN_MANUAL_P410: "EN_MANUAL_P410"
  EN_AUTO_P410: "EN_AUTO_P410"
  EN_MANUAL_P420: "EN_MANUAL_P420"
  EN_AUTO_P420: "EN_AUTO_P420"
  EN_MANUAL_P430: "EN_MANUAL_P430"
  EN_AUTO_P430: "EN_AUTO_P430"
  Partir: "Partir"
  Motor: "Motor"
  CONTADOR: "CONTADOR"

control_modules:
  - id: "recirculation_pump"
    state_tag: "Motor"
    actions:
      partir:
        tag: "Partir"
        mode: "set"
        value: true
      parar:
        tag: "Partir"
        mode: "set"
        value: false
    write_commands:
      set_manual_mode:
        tag: "SEL_MAN_P300"
        data_type: "bool"
  - id: "pump_p410"
    write_commands:
      set_manual_mode:
        tag: "SEL_MAN_P410"
        data_type: "bool"
  - id: "pump_p420"
    write_commands:
      set_manual_mode:
        tag: "SEL_MAN_P420"
        data_type: "bool"
  - id: "pump_p430"
    write_commands:
      set_manual_mode:
        tag: "SEL_MAN_P430"
        data_type: "bool"
  - id: "dosif001"
    write_commands:
      set_contador:
        tag: "CONTADOR"
        data_type: "int32"
        min: 0
        max: 2147483647
