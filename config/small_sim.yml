lagoon_id: "small_sim"
product_type: "small"
source: rockwell
poll_seconds: 1
timezone: "America/Santiago"

backend:
  url: "http://127.0.0.1:8090/ingest/scada"

rockwell:
  ip: "192.168.100.11"
  slot: 0
  timeout_sec: 5

# El collector lee estas mismas claves lógicas. Los controles sólo las
# referencian; ninguna dirección Rockwell queda definida en el backend.
tags:
  Partir: "Partir"
  Motor: "Motor"
  CONTADOR: "CONTADOR"

control_modules:
  - id: "recirculation_pump"
    state_tag: "Motor"
    actions:
      partir:
        tag: "Partir"
        mode: "set"
        value: true
      parar:
        tag: "Partir"
        mode: "set"
        value: false
  - id: "dosif001"
    write_commands:
      set_contador:
        tag: "CONTADOR"
        data_type: "int32"
        min: 0
        max: 2147483647
